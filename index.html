<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF6;--sf:#fff;--ink:#14201A;--mut:#66756B;--f9:#0F241C;--f7:#1D4433;--g6:#2E6B4C;--g3:#A9D6BB;--g1:#E8F3EB;--line:#E4E9E1;--bad:#A23B2E;--warn:#8A6D1E;--r:4px;--serif:"Fraunces",Georgia,serif;--sans:"Inter",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--f9);margin:0}
button{font-family:var(--sans);cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:216px;flex-shrink:0;background:linear-gradient(180deg,var(--f9),#0D1F18);color:#EAF2EC;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font:600 19px var(--serif);color:#fff}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#3B8560,var(--f7));display:flex;align-items:center;justify-content:center;font-size:15px}
.side button.nb{display:block;width:100%;text-align:left;background:none;border:0;color:#b9cdbf;padding:9px 10px;border-radius:var(--r);font-size:14px;margin-bottom:2px}
.side button.nb.on,.side button.nb:hover{background:rgba(255,255,255,.09);color:#fff}
.sync{margin-top:auto;font-size:12px;color:#9db5a5;padding:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#888;margin-right:6px}.dot.live{background:#5fd08c}.dot.err{background:#e07a6f}
.main{flex:1;padding:28px 32px 60px;max-width:1000px;min-width:0}
h2{font-size:26px;margin-bottom:4px}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,36,28,.05)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.grid .card{margin:0}.stat b{display:block;font:600 28px var(--serif);color:var(--f9)}
.lb,label{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid #CBD6C9;border-radius:var(--r);background:#fff;color:var(--ink);font:inherit;margin-top:4px}
input:focus,select:focus{outline:2px solid var(--g3);border-color:var(--g6)}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px}
.btn{background:var(--f7);color:#fff;border:0;border-radius:var(--r);padding:9px 16px;font-weight:500}.btn:hover{background:var(--g6)}
.gh{background:none;border:1px solid var(--line);color:var(--mut);border-radius:var(--r);padding:3px 9px;font-size:12px}.gh:hover{border-color:var(--g6);color:var(--g6)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--g1);color:var(--g6);cursor:pointer}
.tag.Lead{background:#eee;color:#555}.tag.Sampling{background:#F6F0DE;color:var(--warn)}.tag.Rejected{background:#F7E9E6;color:var(--bad)}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.task{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;background:var(--bg)}.task p{margin:0 0 6px}
.ok{color:var(--g6)}.bad{color:var(--bad)}.note{color:var(--mut);font-size:12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--f9),#0D1F18);padding:20px}
.login .card{width:100%;max-width:340px;padding:28px}
.banner{background:#F6F0DE;color:var(--warn);padding:10px 14px;border-radius:var(--r);margin-bottom:14px;font-size:13px}
@media(max-width:720px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px;align-items:center}.brand{padding:4px 8px}.side button.nb{width:auto;margin:0}.sync{margin:0 0 0 auto;padding:4px}.main{padding:18px 14px 50px}}
</style></head><body>
<script>
/* ===== CONFIG ===== */
var DB_URL="https://watch-brand-69f9d-default-rtdb.firebaseio.com";                         // e.g. "https://your-project-default-rtdb.firebaseio.com"  (see setup notes)
/* ================== */
var tabs=["Overview","Suppliers","Landed cost","Tasks","Decisions"],tab="Overview",S={sup:{},tasks:{},dec:{},cost:{unit:40,ship:4,fx:1.37,duty:10,price:199,fee:3,ads:25},team:["Aryan","Adarsh","Preet"]},status="off";
function opts(){return S.team.map(function(n){return '<option>'+esc(n)+'</option>'}).join("")}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function ks(o){return Object.keys(o||{})}
/* ---- data layer: Firebase REST if DB_URL set, else localStorage ---- */
function api(path,method,body){
  if(!DB_URL){try{localStorage.setItem("whq_local",JSON.stringify(S))}catch(e){}return Promise.resolve()}
  return fetch(DB_URL.replace(/\/$/,"")+"/whq/"+path+".json",{method:method,body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){if(!r.ok)throw 0;status="live";dot()}).catch(function(){status="err";dot()})}
function setItem(col,id,obj){S[col][id]=obj;api(col+"/"+id,"PUT",obj);render()}
function delItem(col,id){delete S[col][id];api(col+"/"+id,"DELETE");render()}
function setCost(k,v){S.cost[k]=v;api("cost/"+k,"PUT",v);render()}
function setTeam(i,v){S.team[i]=v;api("team/"+i,"PUT",v)}
function pull(){
  if(!DB_URL)return;
  fetch(DB_URL.replace(/\/$/,"")+"/whq.json").then(function(r){return r.json()}).then(function(d){
    status="live";dot();
    if(!d){seed();return}
    var a=document.activeElement;if(a&&(a.tagName=="INPUT"||a.tagName=="SELECT"))return;
    S.sup=d.sup||{};S.tasks=d.tasks||{};S.dec=d.dec||{};if(d.cost)S.cost=Object.assign(S.cost,d.cost);
    if(d.team)S.team=[0,1,2].map(function(i){return d.team[i]||S.team[i]});
    render()}).catch(function(){status="err";dot()})}
function seed(){
  var t=[["Define brand positioning and price band",0],["Longlist 10 suppliers",1],["Shortlist 3 and order samples",2],["Incorporate in Canada and open a bank account",0],["Confirm HS code and duty with CBSA",1],["Set up Shopify store",2]];
  t.forEach(function(x,i){S.tasks["seed"+i]={t:x[0],o:x[1],s:"Todo"}});
  api("","PUT",{tasks:S.tasks,cost:S.cost,team:S.team});render()}
function dot(){var e=$("dot");if(e){e.className="dot "+status;$("st").textContent=!DB_URL?"Local only":status=="live"?"Live, synced":"Connection problem"}}
/* ---- views ---- */
function calc(){var k=S.cost,land=(k.unit+k.ship)*k.fx*(1+k.duty/100),pr=k.price-land-k.price*k.fee/100-k.ads;return{land:land,pr:pr,m:k.price?pr/k.price*100:0,be:(land+k.ads)/(1-k.fee/100)}}
function score(x){return Math.max(0,x.q*1.2+Math.max(0,4-x.p/20)+Math.max(0,1.5-x.d/40))}
function start(){
  document.body.innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="mark">D</div>Dashboard</div><div id="nv" style="display:contents"></div><div class="sync"><span id="dot" class="dot"></span><span id="st"></span></div></aside><main class="main" id="view"></main></div>';
  if(!DB_URL){try{var l=localStorage.getItem("whq_local");if(l)S=JSON.parse(l)}catch(e){}}
  render();dot();pull();if(DB_URL)setInterval(pull,3000)}
function go(t){tab=t;render()}
function render(){
  if(!$("view"))return;
  $("nv").innerHTML=tabs.map(function(t){return '<button class="nb '+(t==tab?"on":"")+'" onclick="go(\''+t+'\')">'+t+'</button>'}).join("");dot();
  var v=$("view"),ban=DB_URL?"":'<div class="banner">Live sync is off. Data is saved only in this browser. Paste your Firebase URL into DB_URL at the top of the file to let all three of you edit together.</div>',h="";
  var sup=ks(S.sup),tk=ks(S.tasks),open=tk.filter(function(i){return S.tasks[i].s!="Done"}),c=calc();
  if(tab=="Overview"){h='<h2>Overview</h2><p class="sub">Everything the three of us need, in one place.</p>'+ban
   +'<div class="grid"><div class="card stat"><b>'+sup.length+'</b><span class="lb">Suppliers</span></div><div class="card stat"><b>'+sup.filter(function(i){return S.sup[i].st=="Shortlisted"}).length+'</b><span class="lb">Shortlisted</span></div><div class="card stat"><b>'+open.length+'</b><span class="lb">Open tasks</span></div><div class="card stat"><b class="'+(c.m>=0?"ok":"bad")+'">'+c.m.toFixed(0)+'%</b><span class="lb">Net margin</span></div></div>'
   +'<div class="card"><h3>Team</h3><div class="row" style="margin-top:10px">'+S.team.map(function(n,i){return '<div><label>Partner '+(i+1)+'</label><input value="'+esc(n)+'" onchange="setTeam('+i+',this.value)"></div>'}).join("")+'</div></div>'
   +'<div class="card"><h3>Up next</h3>'+(open.slice(0,6).map(function(i){var t=S.tasks[i];return '<p style="margin:6px 0">• '+esc(t.t)+' <span class="note">('+esc(S.team[t.o])+', '+t.s+')</span></p>'}).join("")||'<p class="note">All clear.</p>')+'</div>'}
  if(tab=="Suppliers"){h='<h2>Suppliers</h2><p class="sub">Longlist, sample, shortlist. Tap a status to move it on.</p>'+ban
   +'<div class="card"><div class="row"><div><label>Name</label><input id="sn"></div><div><label>Location</label><input id="sl" placeholder="Shenzhen..."></div><div><label>Unit USD</label><input id="sp" type="number"></div><div><label>MOQ</label><input id="sm" type="number"></div><div><label>Lead days</label><input id="sd" type="number"></div><div><label>Quality 1-5</label><input id="sq" type="number" min="1" max="5"></div><div><label>Added by</label><select id="sb">'+opts()+'</select></div></div><button class="btn" onclick="addS()">Add supplier</button></div>'
   +'<div class="card tw"><table><tr><th>Supplier</th><th>Price</th><th>MOQ</th><th>Lead</th><th>Q</th><th>Score</th><th>Status</th><th></th></tr>'
   +(sup.map(function(i){var x=S.sup[i];return '<tr><td>'+esc(x.n)+'<br><span class="note">'+esc(x.l)+' · by '+esc(x.by||"")+'</span></td><td>$'+x.p+'</td><td>'+x.m+'</td><td>'+x.d+'d</td><td>'+x.q+'</td><td>'+score(x).toFixed(1)+'</td><td><span class="tag '+x.st+'" onclick="cyc(\''+i+'\')">'+x.st+'</span></td><td><button class="gh" onclick="delItem(\'sup\',\''+i+'\')">Remove</button></td></tr>'}).join("")||'<tr><td colspan="8" class="note">No suppliers yet.</td></tr>')+'</table></div>'}
  if(tab=="Landed cost"){var k=S.cost;h='<h2>Landed cost</h2><p class="sub">What one watch really costs you in Canada, and what you keep.</p>'+ban+'<div class="card"><div class="row">'
   +[["unit","Unit cost (USD)"],["ship","Shipping / unit (USD)"],["fx","USD to CAD"],["duty","Duty + tariffs (%)"],["price","Retail price CAD (pre-tax)"],["fee","Payment fee (%)"],["ads","Marketing / sale (CAD)"]].map(function(f){return '<div><label>'+f[1]+'</label><input type="number" step="any" value="'+k[f[0]]+'" onchange="setCost(\''+f[0]+'\',parseFloat(this.value)||0)"></div>'}).join("")+'</div></div>'
   +'<div class="grid"><div class="card stat"><b>$'+c.land.toFixed(2)+'</b><span class="lb">Landed cost</span></div><div class="card stat"><b class="'+(c.pr>=0?"ok":"bad")+'">$'+c.pr.toFixed(2)+'</b><span class="lb">Profit / watch</span></div><div class="card stat"><b>'+c.m.toFixed(0)+'%</b><span class="lb">Net margin</span></div><div class="card stat"><b>$'+c.be.toFixed(0)+'</b><span class="lb">Break-even price</span></div></div><p class="note">Duty is a placeholder. Confirm the HS code and current rates with CBSA. GST/HST is added on top of your price and not counted here.</p>'}
  if(tab=="Tasks"){h='<h2>Tasks</h2><p class="sub">Who is doing what.</p>'+ban+'<div class="card"><div class="row"><div style="grid-column:span 2"><label>New task</label><input id="tt"></div><div><label>Owner</label><select id="to">'+S.team.map(function(n,i){return '<option value="'+i+'">'+esc(n)+'</option>'}).join("")+'</select></div></div><button class="btn" onclick="addT()">Add task</button></div><div class="cols">'
   +["Todo","Doing","Done"].map(function(st){return '<div><h3 style="font-size:15px;margin-bottom:8px">'+st+'</h3>'+tk.map(function(i){var t=S.tasks[i];return t.s!=st?"":'<div class="task"><p>'+esc(t.t)+'</p><span class="note">'+esc(S.team[t.o])+'</span> <button class="gh" onclick="mv(\''+i+'\')">Move →</button> <button class="gh" onclick="delItem(\'tasks\',\''+i+'\')">✕</button></div>'}).join("")+'</div>'}).join("")+'</div>'}
  if(tab=="Decisions"){var dk=ks(S.dec).sort(function(a,b){return S.dec[b].at-S.dec[a].at});h='<h2>Decisions</h2><p class="sub">Write down the big calls so nobody argues twice.</p>'+ban+'<div class="card"><label>What did we decide?</label><input id="dt"><br><br><label>Decided by</label><select id="db" style="max-width:200px">'+opts()+'</select><br><br><button class="btn" onclick="addD()">Log decision</button></div>'
   +(dk.map(function(i){var d=S.dec[i];return '<div class="card"><b>'+esc(d.t)+'</b><br><span class="note">'+esc(d.by)+' · '+new Date(d.at).toDateString()+'</span> <button class="gh" onclick="delItem(\'dec\',\''+i+'\')">✕</button></div>'}).join("")||'<p class="note">Nothing logged yet.</p>')}
  v.innerHTML=h}
function addS(){var n=$("sn").value.trim();if(!n)return;setItem("sup",uid(),{n:n,l:$("sl").value,p:+$("sp").value||0,m:+$("sm").value||0,d:+$("sd").value||0,q:+$("sq").value||3,st:"Lead",by:$("sb").value})}
function cyc(i){var o=["Lead","Sampling","Shortlisted","Rejected"],x=Object.assign({},S.sup[i]);x.st=o[(o.indexOf(x.st)+1)%4];setItem("sup",i,x)}
function addT(){var t=$("tt").value.trim();if(!t)return;setItem("tasks",uid(),{t:t,o:+$("to").value,s:"Todo"})}
function mv(i){var o=["Todo","Doing","Done"],x=Object.assign({},S.tasks[i]);x.s=o[(o.indexOf(x.s)+1)%3];setItem("tasks",i,x)}
function addD(){var t=$("dt").value.trim();if(!t)return;setItem("dec",uid(),{t:t,by:$("db").value,at:Date.now()})}
start();
</script></body></html>
